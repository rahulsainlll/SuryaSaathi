name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm dev --filter web
        2. …
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: App, service or package, e.g. apps/console or services/ingest
