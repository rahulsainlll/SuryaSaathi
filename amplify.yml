# AWS Amplify Hosting for the two Next.js apps in this pnpm monorepo. Each is its own Amplify
# app connected to this repository, with AMPLIFY_MONOREPO_APP_ROOT set to its appRoot:
#   apps/web      the website, live demo and blog
#   apps/console  the DISCOM console (mock data unless its NEXT_PUBLIC_* variables point at
#                 the deployed console API)
# Steps: docs/runbook.md, "Host the website and the console on AWS Amplify".
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # pnpm isn't in Amplify's build image; use the version package.json pins.
            - corepack enable
            - corepack prepare pnpm@10.28.0 --activate
            # Amplify needs a hoisted node_modules for pnpm monorepos. Written here, at build
            # time, so local installs keep pnpm's default layout.
            - echo "node-linker=hoisted" >> ../../.npmrc
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # The workspace packages the site uses (schemas, engine), then the site.
            - (cd ../.. && pnpm turbo run build --filter=web...)
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
  - appRoot: apps/console
    frontend:
      phases:
        preBuild:
          commands:
            # pnpm isn't in Amplify's build image; use the version package.json pins.
            - corepack enable
            - corepack prepare pnpm@10.28.0 --activate
            # Amplify needs a hoisted node_modules for pnpm monorepos. Written here, at build
            # time, so local installs keep pnpm's default layout.
            - echo "node-linker=hoisted" >> ../../.npmrc
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # The workspace packages the console uses (schemas, engine, console-data), then it.
            - (cd ../.. && pnpm turbo run build --filter=console...)
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
