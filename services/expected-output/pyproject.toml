[project]
name = "suryasaathi-expected-output"
version = "0.0.0"
description = "Expected generation from sunlight + haze"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pvlib>=0.12",
    "suryasaathi-core",
]

[tool.uv.sources]
suryasaathi-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
