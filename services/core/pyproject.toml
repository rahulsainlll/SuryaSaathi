[project]
name = "suryasaathi-core"
version = "0.0.0"
description = "Shared rules, schemas, storage and logging for the SuryaSaathi services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.20",
    "boto3>=1.40",
    "jsonschema>=4.25",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
