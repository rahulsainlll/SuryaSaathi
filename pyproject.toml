# uv workspace root for the Python services. Each service under services/ is its
# own package; this root only holds shared dev tooling and config.
[project]
name = "suryasaathi"
version = "0.0.0"
description = "SuryaSaathi Python workspace"
requires-python = ">=3.12"
dependencies = ["suryasaathi-agents", "suryasaathi-ingest", "suryasaathi-expected-output", "suryasaathi-whatsapp", "suryasaathi-rollups"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
suryasaathi-agents = { workspace = true }
suryasaathi-ingest = { workspace = true }
suryasaathi-expected-output = { workspace = true }
suryasaathi-whatsapp = { workspace = true }
suryasaathi-rollups = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "tools/device-sim"]
explicit_package_bases = true
mypy_path = "services/agents/src:services/ingest/src:services/expected-output/src:services/whatsapp/src:services/rollups/src"

[tool.pytest.ini_options]
testpaths = ["services"]
addopts = "--import-mode=importlib"
